<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Vagas abertas — faça parte do nosso time. Cadastre seu currículo em minutos." />
    <title>Vagas abertas — Faça parte do nosso time</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111111;
        --panel: #1a1a1a;
        --panel-2: #1e1e1e;
        --line: rgba(255, 255, 255, 0.06);
        --line-2: rgba(255, 255, 255, 0.1);
        --fg: #f0efec;
        --muted: rgba(240, 239, 236, 0.5);
        --faint: rgba(240, 239, 236, 0.35);
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background:
          radial-gradient(1200px 500px at 50% -10%, rgba(255, 255, 255, 0.05), transparent 60%),
          var(--bg);
        color: var(--fg);
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
      .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
      .brand .name { font-weight: 700; letter-spacing: 0.14em; font-size: 15px; }
      .brand .sub { color: var(--faint); font-size: 12px; }
      .hero h1 { font-size: 26px; margin: 0 0 6px; }
      .hero p { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; line-height: 1.5; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
        transition: border-color 0.2s, background 0.2s, transform 0.2s;
      }
      .card:hover { border-color: var(--line-2); background: var(--panel-2); }
      .card h3 { margin: 0; font-size: 16px; }
      .card .meta { color: var(--faint); font-size: 12.5px; margin-top: 4px; }
      .card .tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
      .tag {
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
        border: 1px solid rgba(52, 211, 153, 0.25); background: rgba(52, 211, 153, 0.1);
        color: #6ee7b7; border-radius: 999px; padding: 3px 9px;
      }
      .tag.neutral { border-color: var(--line-2); background: rgba(255,255,255,0.04); color: var(--muted); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; min-height: 46px; border: 0; border-radius: 11px; cursor: pointer;
        background: var(--fg); color: #111; font-weight: 600; font-size: 14.5px;
        transition: transform 0.15s, opacity 0.15s;
      }
      .btn:active { transform: scale(0.985); }
      .btn[disabled] { opacity: 0.45; cursor: default; }
      .btn.ghost { background: rgba(255,255,255,0.04); color: var(--fg); border: 1px solid var(--line-2); }
      .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 14px; background: none; border: 0; cursor: pointer; padding: 6px 4px; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
      .field input, .field select, .field textarea {
        width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--line-2);
        border-radius: 10px; color: var(--fg); font-size: 15px; padding: 12px 13px; outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(255,255,255,0.25); }
      .field textarea { min-height: 90px; resize: vertical; font-family: inherit; }
      .field .help { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .steps { display: flex; gap: 6px; margin: 4px 0 18px; }
      .steps span { height: 3px; flex: 1; border-radius: 99px; background: rgba(255,255,255,0.08); }
      .steps span.on { background: var(--fg); }
      .steplabel { font-size: 12px; color: var(--faint); margin-bottom: 14px; }
      .success { text-align: center; padding: 40px 10px; }
      .success .ok {
        width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px;
        background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.3);
        display: grid; place-items: center; font-size: 28px; color: #6ee7b7;
      }
      .error-box {
        border: 1px solid rgba(248, 113, 113, 0.25); background: rgba(248, 113, 113, 0.08);
        color: #fca5a5; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px;
      }
      .loading { padding: 60px 0; text-align: center; color: var(--faint); font-size: 13.5px; }
      .skel { height: 78px; border-radius: var(--radius); background: rgba(255,255,255,0.04); margin-bottom: 12px; animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      .foot { margin-top: 34px; text-align: center; color: var(--faint); font-size: 11.5px; }
      .badge-count { color: var(--faint); font-size: 12.5px; margin-bottom: 12px; }
      .filepick { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line-2); border-radius: 12px; padding: 14px; cursor: pointer; }
      .filepick .f { font-size: 13.5px; }
      .filepick .hint { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
      @media (min-width: 640px) { .wrap { padding-top: 46px; } .hero h1 { font-size: 30px; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="loading">Carregando vagas…</div></div>
    <script>window.FLOW_PORTAL_ANON_KEY = '__ANON_KEY__'</script>
    <script>
      // ============================================================
      // PORTAL PÚBLICO DO RH — rh.flwdesk.com/digaspi
      // Endpoints 100% anônimos do flowone (RLS pública):
      //   rh_jobs (status=open) · rh_questions/rh_options (ativas)
      //   RPC rh_submit_application (atômica) · Storage rh-files/cvs
      // Nenhum dado interno do RH é exposto.
      // ============================================================
      const SUPABASE_URL = 'https://flowone.db.flwdesk.com'
      const ANON_KEY = window.FLOW_PORTAL_ANON_KEY || ''
      const app = document.getElementById('app')
      const state = { route: 'home', job: null, questions: [], options: {}, file: null, uploading: false }

      function esc(value) {
        const div = document.createElement('div')
        div.textContent = value == null ? '' : String(value)
        return div.innerHTML
      }
      function api(path, options) {
        options = options || {}
        options.headers = Object.assign({ apikey: ANON_KEY, 'Content-Type': 'application/json' }, options.headers || {})
        return fetch(SUPABASE_URL + path, options).then(async (res) => {
          const json = await res.json().catch(() => null)
          if (!res.ok) throw new Error((json && (json.message || json.error_description || json.error)) || 'Erro ' + res.status)
          return json
        })
      }
      function render(html) { app.innerHTML = html }
      function go(route, job) { state.route = route; state.job = job || null; state.file = null; boot() }

      // ---------------- banco (anon) ----------------
      async function loadJobs() {
        return api('/rest/v1/rh_jobs?select=*&status=eq.open&order=created_at.desc')
      }
      async function loadQuestions(jobId) {
        const rows = await api('/rest/v1/rh_questions?select=*,rh_options(*)&active=eq.true&order=order_index.asc')
        return rows.filter((row) => row.scope === 'GLOBAL' || row.job_id === jobId)
      }
      async function uploadResume(file) {
        const path = 'cvs/' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '/' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_')
        const res = await fetch(SUPABASE_URL + '/storage/v1/object/rh-files/' + path, {
          method: 'POST',
          headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
          body: file
        })
        if (!res.ok) {
          const text = await res.text().catch(() => '')
          throw new Error('Falha no upload do currículo (' + res.status + ') ' + text.slice(0, 120))
        }
        return { storage_path: path, file_name: file.name, mime_type: file.type || 'application/octet-stream', size_bytes: file.size }
      }

      // ---------------- telas ----------------
      function homeView(jobs) {
        const cards = jobs
          .map(
            (job) => `
          <a class="card" href="#/vaga/${job.slug}" data-slug="${job.slug}">
            <h3>${esc(job.title)}</h3>
            <div class="meta">${esc([job.department, job.location, job.work_model].filter(Boolean).join(' · ') || 'Veja os detalhes')}</div>
            <div class="tags">
              <span class="tag">Aberta</span>
              ${job.apps ? '<span class="tag neutral">' + job.apps + ' candidaturas</span>' : ''}
            </div>
          </a>`
          )
          .join('')
        return `
        <div class="brand"><span class="name">FAÇA PARTE</span><span class="sub">Portal de carreiras</span></div>
        <div class="hero">
          <h1>Vagas abertas</h1>
          <p>Encontre a oportunidade ideal e cadastre seu currículo em minutos. Sem cadastro, sem burocracia.</p>
        </div>
        <div class="badge-count">${jobs.length} ${jobs.length === 1 ? 'oportunidade' : 'oportunidades'} disponíveis</div>
        ${cards || '<div class="card"><h3>Nenhuma vaga aberta agora</h3><div class="meta">Volte em breve — novas oportunidades aparecem aqui automaticamente.</div></div>'}
        <div class="foot">Powered by FLOW</div>`
      }

      function jobView(job) {
        const list = (title, items) =>
          items && items.length
            ? '<h3 style="margin:18px 0 6px;font-size:14px;">' + title + '</h3><ul style="margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.7">' + items.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul>'
            : ''
        const salary =
          job.salary_visible && job.salary_min
            ? '<span class="tag neutral">R$ ' + Number(job.salary_min).toLocaleString('pt-BR') + (job.salary_max ? ' – ' + Number(job.salary_max).toLocaleString('pt-BR') : '+') + '</span>'
            : ''
        return `
        <button class="back" data-go="home">← Todas as vagas</button>
        <div class="hero">
          <h1>${esc(job.title)}</h1>
          <p>${esc([job.department, job.location, job.work_model].filter(Boolean).join(' · ') || '')}</p>
          <div class="tags" style="margin-bottom:6px">
            <span class="tag">Aberta</span>${salary}
            <span class="tag neutral">${esc(job.employment_type || '')}</span>
            ${job.openings > 1 ? '<span class="tag neutral">' + job.openings + ' posições</span>' : ''}
          </div>
        </div>
        ${job.description ? '<p style="color:var(--muted);font-size:14px;line-height:1.6">' + esc(job.description) + '</p>' : ''}
        ${list('Responsabilidades', job.responsibilities)}
        ${list('Requisitos', job.requirements)}
        ${list('Benefícios', job.benefits)}
        <div style="margin-top:22px">
          <button class="btn" id="apply-btn">Quero me candidatar</button>
        </div>
        <div class="foot">Powered by FLOW</div>`
      }

      function formView(job) {
        return `
        <button class="back" data-go="job">← ${esc(job.title)}</button>
        <div class="steps"><span class="on"></span><span></span><span class="last"></span></div>
        <div class="steplabel">Etapa 1 de 3 · Seus dados</div>
        <div id="step-body"></div>`
      }

      const form = { full_name: '', email: '', phone: '', cpf: '', birth_date: '', city: '', state: '', street: '', street_number: '', district: '', zip_code: '', answers: {} }
      let stepIndex = 0

      function stepAccount() {
        return `
        <div class="field"><label>Nome completo *</label><input id="f-name" value="${esc(form.full_name)}" autocomplete="name"></div>
        <div class="field"><label>E-mail *</label><input id="f-email" type="email" value="${esc(form.email)}" autocomplete="email"></div>
        <div class="field"><label>Telefone / WhatsApp *</label><input id="f-phone" type="tel" value="${esc(form.phone)}" autocomplete="tel" placeholder="(11) 90000-0000"></div>
        <div class="row">
          <div class="field"><label>CPF</label><input id="f-cpf" value="${esc(form.cpf)}" inputmode="numeric" placeholder="000.000.000-00"></div>
          <div class="field"><label>Nascimento</label><input id="f-birth" type="date" value="${esc(form.birth_date)}"></div>
        </div>
        <div class="row">
          <div class="field"><label>Cidade *</label><input id="f-city" value="${esc(form.city)}"></div>
          <div class="field"><label>Estado (UF)</label><input id="f-state" value="${esc(form.state)}" maxlength="2" placeholder="SP"></div>
        </div>
        <div class="row">
          <div class="field" style="grid-column:1"><label>Endereço</label><input id="f-street" value="${esc(form.street)}"></div>
          <div class="field" style="width:110px"><label>Nº</label><input id="f-number" value="${esc(form.street_number)}"></div>
        </div>
        <div class="row">
          <div class="field"><label>Bairro</label><input id="f-district" value="${esc(form.district)}"></div>
          <div class="field"><label>CEP</label><input id="f-zip" value="${esc(form.zip_code)}" inputmode="numeric"></div>
        </div>
        <div id="form-error"></div>
        <button class="btn" id="next1">Continuar</button>`
      }

      function stepResume() {
        return `
        <div class="field">
          <label>Currículo (PDF ou DOCX, até 10 MB)</label>
          <div class="filepick" id="pick">
            <div class="f" style="font-size:22px">📄</div>
            <div><div class="f" id="fname">Toque para escolher o arquivo</div><div class="hint">PDF, DOC ou DOCX</div></div>
          </div>
          <input id="f-file" type="file" accept=".pdf,.doc,.docx,application/pdf" style="display:none">
        </div>
        <div id="form-error"></div>
        <button class="btn ghost" id="back2" style="margin-bottom:10px">Voltar</button>
        <button class="btn" id="next2">Continuar</button>`
      }

      function stepQuestions() {
        const qs = state.questions
        const body = qs
          .map((question) => {
            const opts = state.options[question.id] || []
            const value = form.answers[question.id]
            let control = ''
            if (question.type === 'TEXT' || question.type === 'NUMBER' || question.type === 'DATE') {
              control = `<input data-q="${question.id}" data-type="${question.type}" value="${esc(value || '')}" ${question.type === 'NUMBER' ? 'inputmode="numeric"' : ''}>`
            } else if (question.type === 'TEXTAREA') {
              control = `<textarea data-q="${question.id}" data-type="TEXTAREA">${esc(value || '')}</textarea>`
            } else if (question.type === 'BOOLEAN') {
              control = `<select data-q="${question.id}" data-type="BOOLEAN"><option value="">Selecione…</option><option value="sim" ${value === 'sim' ? 'selected' : ''}>Sim</option><option value="nao" ${value === 'nao' ? 'selected' : ''}>Não</option></select>`
            } else if (question.type === 'SELECT' && opts.length) {
              control = `<select data-q="${question.id}" data-type="SELECT"><option value="">Selecione…</option>${opts
                .map((option) => '<option value="' + esc(option.value) + '" ' + (value === option.value ? 'selected' : '') + '>' + esc(option.label) + '</option>')
                .join('')}</select>`
            } else if (question.type === 'MULTISELECT' && opts.length) {
              control = opts
                .map(
                  (option) =>
                    '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0;color:var(--muted)"><input type="checkbox" data-qmulti="' + question.id + '" value="' + esc(option.value) + '" ' + (Array.isArray(value) && value.includes(option.value) ? 'checked' : '') + '> ' + esc(option.label) + '</label>'
                )
                .join('')
            } else {
              return ''
            }
            return `<div class="field"><label>${esc(question.label)}${question.required ? ' *' : ''}</label>${control}${question.help_text ? '<div class="help">' + esc(question.help_text) + '</div>' : ''}</div>`
          })
          .join('')
        return `
        ${body || '<p style="color:var(--muted);font-size:13.5px">Tudo pronto! Revise e envie.</p>'}
        <div id="form-error"></div>
        <button class="btn ghost" id="back3" style="margin-bottom:10px" ${state.uploading ? 'disabled' : ''}>Voltar</button>
        <button class="btn" id="submit-all" ${state.uploading ? 'disabled' : ''}>${state.uploading ? 'Enviando…' : 'Enviar candidatura'}</button>`
      }

      function successView() {
        return `
        <div class="success">
          <div class="ok">✓</div>
          <h2 style="margin:0 0 8px">Candidatura enviada!</h2>
          <p style="color:var(--muted);font-size:14px;line-height:1.6;max-width:420px;margin:0 auto 24px">
            Recebemos seu currículo com carinho. Se o seu perfil combinar com a vaga, nosso time entra em contato pelo e-mail ou telefone informado.
          </p>
          <button class="btn ghost" data-go="home">Ver outras vagas</button>
        </div>
        <div class="foot">Powered by FLOW</div>`
      }

      // ---------------- controladores ----------------
      function bindAccount() {
        const next = document.getElementById('next1')
        if (next)
          next.onclick = () => {
            form.full_name = val('f-name')
            form.email = val('f-email')
            form.phone = val('f-phone')
            form.cpf = val('f-cpf')
            form.birth_date = val('f-birth')
            form.city = val('f-city')
            form.state = val('f-state')
            form.street = val('f-street')
            form.street_number = val('f-number')
            form.district = val('f-district')
            form.zip_code = val('f-zip')
            if (!form.full_name.trim() || !form.email.includes('@') || !form.phone.trim() || !form.city.trim()) {
              return showError('Preencha nome, e-mail, telefone e cidade para continuar.')
            }
            stepIndex = 1
            drawStep()
          }
      }
      function bindResume() {
        const pick = document.getElementById('pick')
        const input = document.getElementById('f-file')
        if (pick && input) {
          pick.onclick = () => input.click()
          input.onchange = () => {
            const file = input.files && input.files[0]
            if (!file) return
            if (file.size > 10 * 1024 * 1024) {
              document.getElementById('fname').textContent = 'Arquivo acima de 10 MB — escolha outro'
              return
            }
            state.file = file
            document.getElementById('fname').textContent = file.name
          }
        }
        document.getElementById('back2').onclick = () => { stepIndex = 0; drawStep() }
        document.getElementById('next2').onclick = () => {
          if (!state.file) return showError('Envie seu currículo para continuar (PDF ou DOCX).')
          stepIndex = 2
          drawStep()
        }
      }
      function bindQuestions() {
        document.getElementById('back3').onclick = () => { stepIndex = 1; drawStep() }
        document.querySelectorAll('[data-q]').forEach((el) => {
          el.onchange = el.oninput = () => {
            form.answers[el.dataset.q] = el.value
          }
        })
        document.querySelectorAll('[data-qmulti]').forEach((el) => {
          el.onchange = () => {
            const current = Array.isArray(form.answers[el.dataset.qmulti]) ? form.answers[el.dataset.qmulti] : []
            const next = el.checked ? current.concat([el.value]) : current.filter((value) => value !== el.value)
            form.answers[el.dataset.qmulti] = next
          }
        })
        document.getElementById('submit-all').onclick = () => void submitAll()
      }

      async function submitAll() {
        const button = document.getElementById('submit-all')
        button.disabled = true
        button.textContent = 'Enviando…'
        state.uploading = true
        try {
          const required = state.questions.filter((question) => question.required)
          for (const question of required) {
            const value = form.answers[question.id]
            const empty = value == null || value === '' || (Array.isArray(value) && value.length === 0)
            if (empty) throw new Error('Responda: ' + question.label)
          }
          const uploaded = state.file ? await uploadResume(state.file) : null
          const result = await api('/rest/v1/rpc/rh_submit_application', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + ANON_KEY },
            body: JSON.stringify({
              p_payload: Object.assign(
                {
                  job_id: state.job.id,
                  full_name: form.full_name,
                  email: form.email,
                  phone: form.phone,
                  cpf: form.cpf,
                  birth_date: form.birth_date,
                  city: form.city,
                  state: form.state,
                  zip_code: form.zip_code,
                  street: form.street,
                  street_number: form.street_number,
                  complement: '',
                  district: form.district,
                  answers: form.answers
                },
                uploaded ? { file: uploaded } : {}
              )
            })
          })
          if (result.duplicate) throw new Error(result.message || 'Você já se candidatou a esta vaga.')
          go('success')
        } catch (error) {
          state.uploading = false
          button.disabled = false
          button.textContent = 'Enviar candidatura'
          showError(error.message || 'Não foi possível enviar agora. Tente de novo.')
        }
      }

      function showError(message) {
        const box = document.getElementById('form-error')
        if (box) box.innerHTML = '<div class="error-box">' + esc(message) + '</div>'
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })
      }
      function val(id) {
        const el = document.getElementById(id)
        return el ? el.value : ''
      }
      function drawStep() {
        const body = document.getElementById('step-body')
        const label = document.querySelector('.steplabel')
        const spans = document.querySelectorAll('.steps span')
        if (label) label.textContent = 'Etapa ' + (stepIndex + 1) + ' de 3 · ' + ['Seus dados', 'Currículo', 'Questionário'][stepIndex]
        spans.forEach((span, index) => span.classList.toggle('on', index <= stepIndex))
        if (!body) return
        if (stepIndex === 0) { body.innerHTML = stepAccount(); bindAccount() }
        if (stepIndex === 1) { body.innerHTML = stepResume(); bindResume() }
        if (stepIndex === 2) { body.innerHTML = stepQuestions(); bindQuestions() }
      }

      // ---------------- roteador ----------------
      async function boot() {
        if (state.route === 'success') return render(successView())
        if (state.route === 'form') {
          render(formView(state.job))
          drawStep()
          return
        }
        if (state.route === 'job' && state.job) {
          render(jobView(state.job))
          document.getElementById('apply-btn').onclick = () => {
            state.questions = []
            state.options = {}
            api('/rest/v1/rh_questions?select=*,rh_options(*)&active=eq.true&order=order_index.asc')
              .then((rows) => {
                rows = rows.filter((row) => row.scope === 'GLOBAL' || row.job_id === state.job.id)
                for (const row of rows) {
                  if (row.rh_options && row.rh_options.length) {
                    state.options[row.id] = row.rh_options.sort((a, b) => a.order_index - b.order_index)
                  }
                }
                state.questions = rows
                go('form', state.job)
              })
              .catch(() => go('form', state.job))
          }
          return
        }
        // home
        render('<div class="loading">Carregando vagas…</div>')
        try {
          const jobs = await loadJobs()
          state.route = 'home'
          render(homeView(jobs))
          document.querySelectorAll('[data-slug]').forEach((card) => {
            card.onclick = (event) => {
              event.preventDefault()
              const job = jobs.find((item) => item.slug === card.dataset.slug)
              if (job) go('job', job)
            }
          })
        } catch (error) {
          render('<div class="error-box" style="margin-top:40px">' + esc(error.message || 'Falha ao carregar vagas.') + '</div><div class="foot">Powered by FLOW</div>')
        }
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-go]')
        if (!target) return
        if (target.dataset.go === 'home') go('home')
        if (target.dataset.go === 'job') go('job', state.job)
      })

      void boot()
    </script>
  </body>
</html>
