name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bump installer version
        shell: pwsh
        run: |
          npm version "1.1.$env:GITHUB_RUN_NUMBER" --no-git-tag-version --allow-same-version
      - run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDPLUS_SUPABASE_URL: ${{ secrets.CARDPLUS_SUPABASE_URL }}
          CARDPLUS_SUPABASE_ANON_KEY: ${{ secrets.CARDPLUS_SUPABASE_ANON_KEY }}
          CARDPLUS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CARDPLUS_SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_FALLBACK: ${{ secrets.OPENAI_FALLBACK }}
