name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Resolve release version
        id: bump
        shell: pwsh
        run: |
          # OTA mobile: versão acompanha o app nativo (mobile/package.json) + RUN,
          # ex. 1.3.0.65 — usada na tag e no latest-mobile.yml.
          # Desktop: semver de 3 partes (major.minor do package.json raiz + RUN),
          # ex. 1.3.65 — o electron-builder só aceita 3 partes e o publish procura
          # FLOW-Setup-<versão-desktop>.exe.
          $mobileVersion = (Get-Content -Raw mobile/package.json | ConvertFrom-Json).version
          $otaVersion = "$mobileVersion.$env:GITHUB_RUN_NUMBER"
          $rootVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $rootParts = $rootVersion.Split('.')
          $desktopVersion = "$($rootParts[0]).$($rootParts[1]).$env:GITHUB_RUN_NUMBER"
          npm version $desktopVersion --no-git-tag-version --allow-same-version
          git tag "v$otaVersion"
          git push origin "v$otaVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$desktopVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "OTA_VERSION=$otaVersion"
          Write-Output "VERSION=$desktopVersion OTA_VERSION=$otaVersion"
      - name: Build mobile web bundle
        working-directory: mobile
        env:
          VITE_SUPABASE_URL: https://flowone.db.flwdesk.com
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwMDI5NjAwLCJleHAiOjE5NDc3MDk2MDB9.yPgutsfUlQPS6mjSegQU8MRTaPNK9cKqJiSopVh0GDA
          VITE_FLOW_OPS_URL: https://flowone.db.flwdesk.com/functions/v1/flow-ops
        shell: pwsh
        run: |
          if (-not $env:VITE_FLOW_OPS_URL) {
            $env:VITE_FLOW_OPS_URL = "$($env:VITE_SUPABASE_URL.TrimEnd('/'))/functions/v1/flow-ops"
          }
          npm ci
          npm run build
      - name: Package mobile OTA assets
        shell: pwsh
        run: |
          $version = $env:OTA_VERSION
          if (-not $version) { $version = $env:VERSION }
          $dist = "mobile/dist"
          if (-not (Test-Path $dist)) { throw 'mobile/dist ausente' }
          if (Test-Path mobile-www.zip) { Remove-Item mobile-www.zip }
          Compress-Archive -Path "$dist\*" -DestinationPath mobile-www.zip -Force
          $sha = (Get-FileHash mobile-www.zip -Algorithm SHA512).Hash
          $bytes = [byte[]]::new($sha.Length / 2)
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            $bytes[$i] = [Convert]::ToByte($sha.Substring($i * 2, 2), 16)
          }
          $b64 = [Convert]::ToBase64String($bytes)
          $tag = "v$version"
          $yml = @(
            "version: $version"
            "path: mobile-www.zip"
            "sha512: $b64"
            "url: https://github.com/MuriloFlow/FlowOne/releases/download/$tag/mobile-www.zip"
            "releaseDate: $([DateTime]::UtcNow.ToString('o'))"
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'latest-mobile.yml'), "$yml`n")
          $view = gh release view $tag --json tagName 2>$null
          if (-not $view) {
            gh release create $tag --title "FLOW $version" --notes "FLOW $version" --latest
          } else {
            gh release edit $tag --latest --notes "FLOW $version"
          }
          gh release upload $tag mobile-www.zip latest-mobile.yml --clobber
          gh release view $tag --json assets --jq ".assets[].name"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify mobile OTA assets
        continue-on-error: true
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 8; $i++) {
            $releases = gh api "repos/MuriloFlow/FlowOne/releases?per_page=8" | ConvertFrom-Json
            $hit = $releases | Where-Object {
              -not $_.draft -and ($_.assets.name -contains 'latest-mobile.yml') -and ($_.assets.name -contains 'mobile-www.zip')
            } | Select-Object -First 1
            if ($hit) {
              $ok = $true
              Write-Output "OTA ok em $($hit.tag_name)"
              break
            }
            Write-Output "Aguardando latest-mobile.yml tentativa $($i + 1)"
            Start-Sleep -Seconds 4
          }
          if (-not $ok) { throw "Release sem latest-mobile.yml. O APK nao consegue atualizar." }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish desktop installer
        if: always() && steps.bump.outcome == 'success'
        shell: pwsh
        run: |
          npm run dist:publish 2>&1 | Tee-Object -FilePath desktop-publish.log
          exit $LASTEXITCODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Publica os assets desktop na MESMA release da OTA (tag 4 partes).
          RELEASE_TAG: v${{ env.OTA_VERSION }}
          VITE_SUPABASE_URL: https://flowone.db.flwdesk.com
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwMDI5NjAwLCJleHAiOjE5NDc3MDk2MDB9.yPgutsfUlQPS6mjSegQU8MRTaPNK9cKqJiSopVh0GDA
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTAwMjk2MDAsImV4cCI6MTk0NzcwOTYwMH0.DiNtBP8vUMyrYwv2A_j0TYN8AwbpY3tlIEnVABNrRAw
          CARDPLUS_SUPABASE_URL: https://cardplus.db.flwdesk.com
          CARDPLUS_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwMDI5NjAwLCJleHAiOjE5NDc3MDk2MDB9.yPgutsfUlQPS6mjSegQU8MRTaPNK9cKqJiSopVh0GDA
          CARDPLUS_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTAwMjk2MDAsImV4cCI6MTk0NzcwOTYwMH0.DiNtBP8vUMyrYwv2A_j0TYN8AwbpY3tlIEnVABNrRAw
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_FALLBACK: ${{ secrets.OPENAI_FALLBACK }}
      - name: Upload desktop publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-publish-log
          path: desktop-publish.log
          if-no-files-found: ignore

      - name: Set up JDK 21 for Android build
        if: always() && steps.bump.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android APK
        if: always() && steps.bump.outcome == 'success'
        working-directory: mobile
        shell: pwsh
        run: |
          npx cap sync android
          $gradle = Join-Path (Get-Location) 'android\gradlew.bat'
          & $gradle -p android assembleRelease --no-daemon
          $apk = Get-ChildItem 'android\app\build\outputs\apk\release\*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'APK não gerado' }
          Copy-Item $apk.FullName ..\flow-release.apk
          Write-Output "APK: $($apk.Name) ($([Math]::Round($apk.Length/1MB,1)) MB)"
      - name: Upload APK to release
        if: always() && steps.bump.outcome == 'success'
        shell: pwsh
        run: |
          if (-not (Test-Path flow-release.apk)) { throw 'flow-release.apk ausente' }
          $tag = "v$env:OTA_VERSION"
          # Nome fixo FLOW.apk para a landing de download (link estável no latest).
          Copy-Item flow-release.apk FLOW.apk -Force
          gh release upload $tag flow-release.apk FLOW.apk --clobber
          gh release view $tag --json assets --jq ".assets[].name"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_VERSION: ${{ env.OTA_VERSION }}

