name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bump installer version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version --allow-same-version
          git tag "v$version"
          git push origin "v$version"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Write-Output "VERSION=$version"
      - name: Build mobile web bundle
        working-directory: mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FLOW_OPS_URL: ${{ secrets.VITE_FLOW_OPS_URL }}
        shell: pwsh
        run: |
          if (-not $env:VITE_FLOW_OPS_URL) {
            $env:VITE_FLOW_OPS_URL = "$($env:VITE_SUPABASE_URL.TrimEnd('/'))/functions/v1/flow-ops"
          }
          npm ci
          npm run build
      - name: Package mobile OTA assets
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw 'VERSION ausente' }
          $dist = "mobile/dist"
          if (-not (Test-Path $dist)) { throw 'mobile/dist ausente' }
          if (Test-Path mobile-www.zip) { Remove-Item mobile-www.zip }
          Compress-Archive -Path "$dist\*" -DestinationPath mobile-www.zip -Force
          $sha = (Get-FileHash mobile-www.zip -Algorithm SHA512).Hash
          $bytes = [byte[]]::new($sha.Length / 2)
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            $bytes[$i] = [Convert]::ToByte($sha.Substring($i * 2, 2), 16)
          }
          $b64 = [Convert]::ToBase64String($bytes)
          $tag = "v$version"
          $view = gh release view $tag --json tagName 2>$null
          if (-not $view) {
            $latest = gh api repos/MuriloFlow/FlowOne/releases/latest --jq .tag_name
            if ($latest) { $tag = $latest }
          }
          $yml = @(
            "version: $version"
            "path: mobile-www.zip"
            "sha512: $b64"
            "url: https://github.com/MuriloFlow/FlowOne/releases/download/$tag/mobile-www.zip"
            "releaseDate: $([DateTime]::UtcNow.ToString('o'))"
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'latest-mobile.yml'), "$yml`n")
          if (-not (gh release view $tag --json tagName 2>$null)) {
            gh release create $tag --title $tag --notes "FLOW $version"
          }
          gh release upload $tag mobile-www.zip latest-mobile.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw 'VERSION ausente' }
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 6
            try {
              $res = Invoke-WebRequest -Uri "https://github.com/MuriloFlow/FlowOne/releases/latest/download/latest-mobile.yml" -UseBasicParsing -TimeoutSec 30
              if ($res.StatusCode -eq 200 -and $res.Content -match 'mobile-www.zip') {
                $ok = $true
                Write-Output "OTA ok: latest-mobile.yml"
                break
              }
            } catch {
              Write-Output "Aguardando latest-mobile.yml tentativa $($i + 1)"
            }
          }
          if (-not $ok) { throw "Release sem latest-mobile.yml. O APK nao consegue atualizar." }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run dist:publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDPLUS_SUPABASE_URL: ${{ secrets.CARDPLUS_SUPABASE_URL }}
          CARDPLUS_SUPABASE_ANON_KEY: ${{ secrets.CARDPLUS_SUPABASE_ANON_KEY }}
          CARDPLUS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CARDPLUS_SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_FALLBACK: ${{ secrets.OPENAI_FALLBACK }}

