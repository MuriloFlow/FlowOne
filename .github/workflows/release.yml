name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bump installer version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version --allow-same-version
          git tag "v$version"
          git push origin "v$version"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Write-Output "VERSION=$version"
      - run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDPLUS_SUPABASE_URL: ${{ secrets.CARDPLUS_SUPABASE_URL }}
          CARDPLUS_SUPABASE_ANON_KEY: ${{ secrets.CARDPLUS_SUPABASE_ANON_KEY }}
          CARDPLUS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CARDPLUS_SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_FALLBACK: ${{ secrets.OPENAI_FALLBACK }}
      - name: Build mobile web bundle
        working-directory: mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FLOW_OPS_URL: ${{ secrets.VITE_FLOW_OPS_URL }}
        shell: pwsh
        run: |
          if (-not $env:VITE_FLOW_OPS_URL) {
            $env:VITE_FLOW_OPS_URL = "$($env:VITE_SUPABASE_URL.TrimEnd('/'))/functions/v1/flow-ops"
          }
          npm ci
          npm run build
      - name: Package mobile OTA assets
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw 'VERSION ausente' }
          $dist = "mobile/dist"
          if (-not (Test-Path $dist)) { throw 'mobile/dist ausente' }
          if (Test-Path mobile-www.zip) { Remove-Item mobile-www.zip }
          Compress-Archive -Path "$dist\*" -DestinationPath mobile-www.zip -Force
          $sha = (Get-FileHash mobile-www.zip -Algorithm SHA512).Hash
          $bytes = [byte[]]::new($sha.Length / 2)
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            $bytes[$i] = [Convert]::ToByte($sha.Substring($i * 2, 2), 16)
          }
          $b64 = [Convert]::ToBase64String($bytes)
          @(
            "version: $version"
            "path: mobile-www.zip"
            "sha512: $b64"
            "url: https://github.com/MuriloFlow/FlowOne/releases/download/v$version/mobile-www.zip"
            "releaseDate: $([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path latest-mobile.yml -Encoding utf8
          gh release upload "v$version" mobile-www.zip latest-mobile.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw 'VERSION ausente' }
          $files = @(
            "latest.yml",
            "FLOW-Setup-$version.exe",
            "FLOW-Setup-$version.exe.blockmap",
            "latest-mobile.yml",
            "mobile-www.zip"
          )
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 6
            $missing = @()
            foreach ($name in $files) {
              $url = "https://github.com/MuriloFlow/FlowOne/releases/download/v$version/$name"
              try {
                $res = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -TimeoutSec 30
                if ($res.StatusCode -ne 200) { $missing += $name }
              } catch {
                $missing += $name
              }
            }
            if ($missing.Count -eq 0) {
              $ok = $true
              Write-Output "Assets ok: $($files -join ', ')"
              break
            }
            Write-Output "Aguardando assets ($($missing -join ', ')) tentativa $($i + 1)"
          }
          if (-not $ok) { throw "Release v$version incompleto. Faltam instalador, latest.yml ou o bundle mobile." }

