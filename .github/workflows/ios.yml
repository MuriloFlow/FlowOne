name: iOS IPA

# Empacota o projeto iOS (equivalente profissional do APK).
# IPA assinado só é gerado se secrets Apple_* estiverem configurados no repositório.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
      - 'scripts/package-ios.mjs'
      - 'scripts/build-installers.mjs'

concurrency:
  group: flow-ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps + sync
        working-directory: mobile
        env:
          VITE_SUPABASE_URL: https://flowone.db.flwdesk.com
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwMDI5NjAwLCJleHAiOjE5NDc3MDk2MDB9.yPgutsfUlQPS6mjSegQU8MRTaPNK9cKqJiSopVh0GDA
          VITE_FLOW_OPS_URL: https://flowone.db.flwdesk.com/functions/v1/flow-ops
        run: |
          if [ -z "${VITE_FLOW_OPS_URL:-}" ] && [ -n "${VITE_SUPABASE_URL:-}" ]; then
            export VITE_FLOW_OPS_URL="${VITE_SUPABASE_URL%/}/functions/v1/flow-ops"
          fi
          npm ci
          npm run build
          npx cap sync ios

      - name: Package iOS source for download/
        run: node scripts/package-ios.mjs

      - name: Upload iOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-iOS-package
          path: |
            download/FLOW-*-iOS.zip
            download/FLOW-iOS-LEIA-ME.txt
            download/latest-mobile.yml
            download/mobile-www.zip
          if-no-files-found: warn

      - name: Build signed IPA when Apple secrets exist
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Secrets Apple não configurados — IPA assinado pulado (pacote-fonte já está no artifact)."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/flow-dist.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/flow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/flow.mobileprovision"
          fi
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions-AdHoc.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions-AdHoc.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions-AppStore.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions-AppStore.plist
          chmod +x scripts/build-ios-ipa.sh
          ./scripts/build-ios-ipa.sh ad-hoc

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-iOS-ipa
          path: download/FLOW-*.ipa
          if-no-files-found: ignore
